<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Список задач</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="app__header">
      <h1 class="app__title">Мои задачи</h1>
      <p class="app__counter" id="counter" aria-live="polite"></p>
    </header>

    <form class="todo-form" id="todo-form" autocomplete="off">
      <label for="todo-input" class="visually-hidden">Новая задача</label>
      <input
        type="text"
        id="todo-input"
        class="todo-form__input"
        placeholder="Что нужно сделать?"
        maxlength="200"
        required
      >
      <button type="submit" class="todo-form__button">Добавить</button>
    </form>

    <ul class="todo-list" id="todo-list"></ul>

    <p class="empty-state" id="empty-state">Пока задач нет — добавьте первую!</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
